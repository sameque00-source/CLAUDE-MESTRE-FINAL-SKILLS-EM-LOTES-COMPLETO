<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Acessível</title>
  <style>
    :root {
      --bg-color: #f9f9f9;
      --text-color: #1a1a1a;
      --primary-color: #0056b3;
      --primary-hover: #003d82;
      --focus-ring: #ffbf47;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text-color);
    }

    .counter-display {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      color: var(--primary-color);
    }

    button {
      background-color: var(--primary-color);
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Contador de Cliques</h1>
    <div class="counter-display" aria-live="polite" id="counter-value">0</div>
    <button id="increment-btn" type="button">
      Incrementar
    </button>
    <div id="error-msg" class="sr-only" aria-live="assertive"></div>
  </main>

  <script>
    const btn = document.getElementById('increment-btn');
    const display = document.getElementById('counter-value');
    const errorMsg = document.getElementById('error-msg');
    let count = 0;

    btn.addEventListener('click', () => {
      if (count < Number.MAX_SAFE_INTEGER) {
        count++;
        display.textContent = count;
        errorMsg.textContent = '';
      } else {
        errorMsg.textContent = 'Limite máximo de valor atingido.';
      }
    });
  </script>
</body>
</html>
