<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Acessível</title>
    <style>
        :root {
            --cor-bg: #f9f9f9;
            --cor-texto: #111111;
            --cor-primaria: #0056b3;
            --cor-primaria-hover: #003d82;
            --cor-foco: #ffbf00;
            --cor-card: #ffffff;
            --cor-borda: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--cor-bg);
            color: var(--cor-texto);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        main {
            background-color: var(--cor-card);
            border: 1px solid var(--cor-borda);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .contador-display {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .botoes {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        button {
            background-color: var(--cor-primaria);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--cor-primaria-hover);
        }

        /* Foco visível estrito para teclado */
        button:focus-visible {
            outline: 3px solid var(--cor-primaria);
            outline-offset: 3px;
            box-shadow: 0 0 0 5px var(--cor-foco);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <main>
        <h1>Contador Interativo</h1>
        <p class="sr-only" id="instrucao-uso">Use os botões abaixo para incrementar ou decrementar o valor do contador.</p>
        
        <div class="contador-display" aria-live="polite" aria-atomic="true">
            <span id="valor-contador">0</span>
        </div>

        <div class="botoes">
            <button type="button" id="btn-decrementar" aria-label="Decrementar valor">- Decrementar</button>
            <button type="button" id="btn-incrementar" aria-label="Incrementar valor">+ Incrementar</button>
        </div>
    </main>

    <script>
        const btnIncrementar = document.getElementById('btn-incrementar');
        const btnDecrementar = document.getElementById('btn-decrementar');
        const valorContador = document.getElementById('valor-contador');

        let contador = 0;

        function atualizarContador(novoValor) {
            contador = novoValor;
            valorContador.textContent = contador;
        }

        btnIncrementar.addEventListener('click', () => {
            atualizarContador(contador + 1);
        });

        btnDecrementar.addEventListener('click', () => {
            atualizarContador(contador - 1);
        });
    </script>
</body>
</html>
